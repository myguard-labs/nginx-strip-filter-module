# sync-sha: b59998383e2685a0f6d85964660421dfd6387f791afcd804de8b7516ba4da8ca
name: Bump versions

# Weekly: check nginx.org for a newer mainline release than what's pinned,
# move every GitHub Action sha pin to its newest release, and open a PR.
# ci/tools/bump-versions.sh does the actual work (also runnable locally with
# --dry-run to preview).
#
# Opens a PR rather than pushing straight to master -- master carries a
# required-pull-request ruleset with no bypass actor, so a direct push is
# always rejected (GH013). The bot pushes a branch and opens a PR via
# BUMP_PR_TOKEN (a classic PAT -- the default GITHUB_TOKEN cannot create
# PRs on myguard-labs repos). Normal review/required-checks gate the merge.
#
# BUMP_PR_TOKEN authenticates gh for both the signed GraphQL commit and the PR.
#
# Action pins (keep in sync with build-test.yml):
# actions/checkout@v5.1.0 -> fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
#
# NOT a PR-lane member: schedule + workflow_dispatch only, never called from
# ci.yml. It runs unattended against master (not a PR head), needs write
# credentials no PR run should carry, and touches nothing ci.yml's callers
# depend on -- adding it to the orchestrator would gate every PR on a job
# that has no PR-shaped input to check.

on:
  schedule:
    # Weekly, Monday 04:00 UTC.
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

concurrency:
  group: bump-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bump:
    name: Bump nginx/action pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run bump script
        id: bump
        env:
          # Every action-pin lookup hits api.github.com; unauthenticated, the
          # shared runner IP is rate-limited to 403s. bump-actions.sh treats a
          # failed lookup as fatal rather than "nothing to bump", so a
          # missing/expired token fails this step instead of quietly leaving
          # the pins to rot.
          GH_TOKEN: ${{ secrets.BUMP_PR_TOKEN }}
        run: bash ci/tools/bump-versions.sh

      - name: Open PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.BUMP_PR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing changed, skipping PR"
            exit 0
          fi
          branch="bump/versions-$(date -u +%Y%m%d)"
          repo="${GITHUB_REPOSITORY}"
          base="$(git rev-parse HEAD)"

          # GraphQL's createCommitOnBranch signs commits with GitHub's key.
          # Reset a same-day bot branch to the checked-out master, or create it.
          if ! gh api --method PATCH "repos/$repo/git/refs/heads/$branch" \
              -f sha="$base" -F force=true >/dev/null 2>&1; then
            gh api --method POST "repos/$repo/git/refs" \
              -f ref="refs/heads/$branch" -f sha="$base" >/dev/null
          fi

          additions='[]'
          deletions='[]'
          while IFS=$'\t' read -r status path; do
            case "$status" in
              D)
                deletions="$(jq --arg path "$path" '. + [{path: $path}]' <<<"$deletions")"
                ;;
              *)
                contents="$(base64 -w0 < "$path")"
                additions="$(jq --arg path "$path" --arg contents "$contents" \
                  '. + [{path: $path, contents: $contents}]' <<<"$additions")"
                ;;
            esac
          done < <(git diff --no-renames --name-status HEAD)

          payload="$(jq -n \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url signature { isValid } } } }' \
            --arg repo "$repo" --arg branch "$branch" --arg base "$base" \
            --argjson additions "$additions" --argjson deletions "$deletions" \
            '{query: $query, variables: {input: {
              branch: {repositoryNameWithOwner: $repo, branchName: $branch},
              expectedHeadOid: $base,
              message: {headline: "chore: bump nginx/action pins", body: "Automated weekly version check (ci/tools/bump-versions.sh)."},
              fileChanges: {additions: $additions, deletions: $deletions}
            }}}')"
          response="$(printf '%s' "$payload" | gh api graphql --input -)"
          jq -e '.data.createCommitOnBranch.commit.signature.isValid == true' \
            <<<"$response" >/dev/null || {
              echo "::error::GitHub did not report a valid signature for the bump commit" >&2
              exit 1
            }

          # An open PR for this branch may already exist from that earlier
          # run; the signed commit above has refreshed it, so there is nothing to do.
          if [ -n "$(gh pr list --head "$branch" --state open --json number -q '.[0].number')" ]; then
            echo "PR for $branch already open, refreshed by the push"
            exit 0
          fi
          gh pr create \
            --title "chore: bump nginx/action pins ($(date -u +%Y-%m-%d))" \
            --body "Automated weekly version check (ci/tools/bump-versions.sh). Review the diff and let required CI checks gate the merge." \
            --base master \
            --head "$branch"
