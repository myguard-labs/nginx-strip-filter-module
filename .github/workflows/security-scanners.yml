# sync-sha: 960948ff0c902ab0c56b837103c9ec127126795cda9f631b6479e3d1a67e9720
name: Security scanners

# Static / security scanners gate on every PR/push — flawfinder, clang-tidy
# (cert-*, security.*) and semgrep over the module sources. Same job as the
# ci-deep.yml scanners job, promoted to a PR gate.
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/upload-artifact@v5 -> 330a01c490aca151604b8cf639adc76d48f6c5d4
# actions/cache@v4           -> 0057852bfaa89a56745cba8c7296529d2fc39830

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The scanners job configures a real nginx source tree for clang-tidy headers.
  NGINX_VERSION: "1.31.1"
  NGINX_VERSION_SHA256: "9fcaaeb8f22544b09a19a761f3412c4112215422401634bebdd1296a403cc4bc"

on:
  # Triggered by ci.yml, which lanes the PR suite so peak runner use stays
  # bounded. No push/pull_request trigger here on purpose: two entry points
  # would run this twice per PR and defeat the laning.
  workflow_call: {}

concurrency:
  group: security-scanners-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scanners:
    name: Security scanners
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flawfinder clang-tidy python3 python3-pip pipx nginx-dev
          # semgrep: isolate via pipx (PEP 668 blocks a bare pip3 install into the
          # system Python on the Ubuntu 24.04 self-hosted runner). Fall back to a
          # user pip install with --break-system-packages if pipx is unavailable.
          if command -v pipx >/dev/null; then
            pipx install --quiet semgrep
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            pip3 install --quiet --user --break-system-packages semgrep
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      # Keyed on version+sha256, matching every other tarball cache in this
      # repo: a re-pinned sha at the same version string must invalidate.
      - name: Cache source tarball
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/nginx-${{ env.NGINX_VERSION }}.tar.gz
          key: src-nginx-${{ env.NGINX_VERSION }}-${{ env.NGINX_VERSION_SHA256 }}

      - name: Configure nginx src tree (clang-tidy headers)
        # Digest-verified, not a bare wget: this step used to fetch the
        # tarball unverified, so a compromised/corrupted upstream archive
        # would silently feed clang-tidy (and go green). fetch-verify.sh is
        # the same helper ci-build.sh uses for every other build in this
        # repo -- reused here rather than writing a second fetcher.
        run: |
          set -euo pipefail
          mkdir -p .build
          bash .github/scripts/fetch-verify.sh \
            "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz" \
            "$NGINX_VERSION_SHA256" \
            ".build/nginx-${NGINX_VERSION}.tar.gz"
          tar -xzf ".build/nginx-${NGINX_VERSION}.tar.gz"
          cd "nginx-${NGINX_VERSION}"
          CC=gcc ./configure --with-compat --add-dynamic-module="$GITHUB_WORKSPACE" >/dev/null
          echo "NGINX_SRC_TREE=$PWD" >> "$GITHUB_ENV"
      - name: flawfinder
        run: |
          flawfinder --minlevel=1 \
            "$GITHUB_WORKSPACE/src/ngx_http_strip_filter_module.c" \
            "$GITHUB_WORKSPACE/src/strip_core.c" 2>&1 | tee flawfinder.log
          if flawfinder --minlevel=4 --quiet \
               "$GITHUB_WORKSPACE/src/ngx_http_strip_filter_module.c" \
               "$GITHUB_WORKSPACE/src/strip_core.c" 2>/dev/null | grep -Eq 'Hits = [1-9]'; then
            echo "✗ flawfinder: high-severity (>=4) findings" >&2
            exit 1
          fi
      - name: clang-tidy (cert-*, security.*)
        run: |
          set -euo pipefail
          N="$NGINX_SRC_TREE"
          INCLUDES="-I$N/src/core -I$N/src/event -I$N/src/event/modules -I$N/src/event/quic \
            -I$N/src/os/unix -I$N/objs -I$N/src/http -I$N/src/http/modules -I$N/src/http/v2 \
            -I$GITHUB_WORKSPACE -I/usr/include"
          status=0
          for f in \
            "$GITHUB_WORKSPACE/src/strip_core.c" \
            "$GITHUB_WORKSPACE/src/ngx_http_strip_filter_module.c"; do
            # shellcheck disable=SC2086
            clang-tidy "$f" \
              --checks='-*,cert-*,clang-analyzer-security.*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling' \
              --warnings-as-errors='*' -- $INCLUDES 2>&1 | tee -a clang-tidy.log || status=1
          done
          exit "$status"
      - name: semgrep
        run: |
          semgrep scan --config p/c --config p/security-audit \
            "$GITHUB_WORKSPACE/src/strip_core.c" \
            "$GITHUB_WORKSPACE/src/ngx_http_strip_filter_module.c" 2>&1 | tee semgrep.log || true
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: security-reports
          path: |
            ${{ github.workspace }}/flawfinder.log
            ${{ github.workspace }}/clang-tidy.log
            ${{ github.workspace }}/semgrep.log
          retention-days: 14
