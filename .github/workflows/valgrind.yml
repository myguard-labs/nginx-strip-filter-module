# sync-sha: d60c644d2e2d40628f4cbbc17d5b84767f667896ac2be277625b893283e8163c
name: Valgrind

# Valgrind memcheck lite soak — the Test::Nginx ci/t/ suite run once under
# valgrind memcheck. The full memcheck + helgrind soak lives in ci-deep.yml
# (monthly cron + workflow_dispatch).
#
# NOT A PR-LANE MEMBER, on purpose. This ran as a ci.yml member until
# 2026-08-05; it was the PR lane's budget-setter at 769s measured (run
# 31008062208), and with queueing the whole PR suite took 13-15 min (worst
# observed 24 min) with this job's "Memcheck lite" leg alone at 12:57. Every PR
# in the repo paid that. The job itself is UNCHANGED -- same suite, same
# suppressions file, same --error-exitcode=99, same leak kinds, same log grep.
# Only its trigger moved: weekly cron + workflow_dispatch instead of per-PR.
#
# This is a DELIBERATE DIVERGENCE from the nginx-skeleton-module reference,
# which keeps valgrind in the PR lane. Do not "restore" it as accidental drift
# -- see memory/labs/nginx-strip-filter-module/skeleton-findings.md (F-VG) and
# CI_PERFORMANCE.md. Memory-error detection on the merge path is still covered
# per-PR by asan.yml (ASan+UBSan over the same ci/t/ suite, halt_on_error=1);
# valgrind adds leak-kind and uninitialised-read classes ASan does not, which
# is why it is preserved weekly rather than deleted.
#
# Run it on demand against a branch before merging anything memory-relevant:
#   gh workflow run valgrind.yml -R myguard-labs/nginx-strip-filter-module --ref <branch>
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5.1.0        -> fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
# actions/upload-artifact@v5.0.0 -> 330a01c490aca151604b8cf639adc76d48f6c5d4
# actions/cache@v4.3.0           -> 0057852bfaa89a56745cba8c7296529d2fc39830

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CCACHE_DIR: ${{ github.workspace }}/.ccache

on:
  schedule:
    # Weekly, Wednesday @ 02:15 UTC. Staggered off every other schedule in this
    # repo so the 4-slot builder02 ceiling is never contended: bump.yml is Mon
    # 04:00, codeql.yml is day-4 04:47, ci-deep.yml is day-6 03:30.
    - cron: "15 2 * * 3"
  workflow_dispatch: {}
  # workflow_call is retained so ci-deep.yml or a future orchestrator can still
  # invoke this file directly. No push/pull_request trigger: this is
  # deliberately off the merge path (see header).
  workflow_call: {}

concurrency:
  group: valgrind-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  memcheck-lite:
    name: Memcheck lite (ci/t/ suite under valgrind)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 45
    env:
      # This job's OWN 64-wide port band. build-test.yml, asan.yml and
      # valgrind.yml pin the same self-hosted runner and have disjoint
      # concurrency groups, so nothing serialises them: two runtime suites can
      # start at the same instant, and a shared default port makes the later
      # one's listener collide with the earlier one's server.
      TEST_BASE_PORT: '19456'
    steps:
      - name: Checkout module
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Load pinned versions
        run: bash .github/scripts/load-versions.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libpcre2-dev valgrind zlib1g-dev \
            cpanminus libio-socket-ssl-perl ccache
          sudo cpanm --notest --quiet Test::Nginx

      # Keyed on version+sha256, not version alone: re-pinning the sha at an
      # unchanged version string must invalidate this cache, not keep
      # serving the old bytes forever.
      - name: Cache source tarball
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/nginx-${{ env.NGINX_VERSION }}.tar.gz
          key: src-nginx-${{ env.NGINX_VERSION }}-${{ env.NGINX_VERSION_SHA256 }}

      # Hybrid: self-hosted disk persists naturally; actions/cache backs the
      # fork path. No restore-keys prefix (never partial-match a build tree).
      - name: Cache ccache (debug)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-valgrind-debug-${{ hashFiles('src/**', 'ci/tools/ci-build.sh') }}

      - name: Build debug server and module
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" debug

      - name: ccache stats
        if: always()
        run: ccache -s

      # Runs BEFORE the first step that binds the band -- `prove` below. Fails
      # if the band reaches the kernel ephemeral range or is already occupied
      # by a leftover server, either of which would otherwise surface inside
      # the suite as a bind error or a timeout with no cause attached.
      - name: Verify this job's port band is free
        run: bash ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Run Test::Nginx suite under Memcheck (WITH suppressions)
        env:
          # TEST_NGINX_BINARY must be the bare nginx path: Test::Nginx runs
          # can_run($TEST_NGINX_BINARY) and bails ("Cannot find the nginx
          # executable in the PATH") if it is a multi-word command. The valgrind
          # wrapper goes through the native TEST_NGINX_USE_VALGRIND hook instead
          # (string form: Test::Nginx prepends `valgrind -q <opts>`).
          TEST_NGINX_SERVROOT: ${{ github.workspace }}/ci/t/servroot
          TEST_NGINX_BINARY: ${{ github.workspace }}/.build/nginx-${{ env.NGINX_VERSION }}/objs/nginx
          TEST_NGINX_USE_VALGRIND: >-
            --tool=memcheck --track-origins=yes --leak-check=full
            --show-leak-kinds=definite,indirect
            --errors-for-leak-kinds=definite,indirect --error-exitcode=99
            --suppressions=${{ github.workspace }}/ci/tools/valgrind.supp
            --log-file=${{ github.workspace }}/valgrind-%p.log
          TEST_NGINX_LOAD_MODULES: >-
            ${{ github.workspace }}/.build/nginx-${{ env.NGINX_VERSION }}/objs/ngx_http_strip_filter_module.so
          TEST_NGINX_SLEEP: 2
          TEST_NGINX_PORT: ${{ env.TEST_BASE_PORT }}
        run: prove -v ci/t/

      - name: Verify Memcheck reports
        if: always()
        run: |
          cat valgrind-*.log || true
          if grep -Eq 'ERROR SUMMARY: [1-9][0-9]* errors' valgrind-*.log 2>/dev/null; then
            exit 1
          fi

      - name: Upload Memcheck reports
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: memcheck-lite-reports
          path: valgrind-*.log
          retention-days: 14
