# sync-sha: a36f103a20605b0cd352bffefacb007de96a77c226b6f79390921c0d7e202c97
name: Fuzzing

# Fast fuzz regression gate on every PR/push — 20s/target on all 6 strip
# kinds (html/css/js/json/svg/xml). Long fuzz discovery lives in ci-deep.yml
# (monthly cron + workflow_dispatch).
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5.1.0        -> fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
# actions/upload-artifact@v5.0.0 -> 330a01c490aca151604b8cf639adc76d48f6c5d4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # Triggered by ci.yml, which lanes the PR suite so peak runner use stays
  # bounded. No push/pull_request trigger here on purpose: two entry points
  # would run this twice per PR and defeat the laning.
  workflow_call: {}

concurrency:
  group: fuzzing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz-regression:
    name: Fuzz regression (20s/target)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout module
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install clang + libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build fuzz targets
        run: bash ci/fuzz/build.sh "$GITHUB_WORKSPACE/ci/fuzz"

      - name: Replay regressions (deterministic)
        run: |
          set -euo pipefail
          cd ci/fuzz
          for k in html css js json svg xml; do
            echo "::group::replay_fuzz_strip_${k}"
            set +e
            ./"fuzz_strip_${k}" \
              -runs=0 \
              -dict="fuzz.dict.${k}" \
              "corpus_${k}/"
            rc=$?
            set -e
            [ $rc -eq 0 ] || { echo "❌ replay_fuzz_strip_${k} crash (exit $rc)"; exit 1; }
            echo "::endgroup::"
            echo "✓ replay_fuzz_strip_${k}: all corpus seeds pass"
          done

      - name: Fuzz each target 20s (fresh mutations)
        run: |
          set -euo pipefail
          cd ci/fuzz
          for k in html css js json svg xml; do
            echo "::group::fuzz_strip_${k}"
            set +e
            ./"fuzz_strip_${k}" \
              -max_total_time=20 \
              -dict="fuzz.dict.${k}" \
              -print_final_stats=1 \
              -artifact_prefix="crash-${k}-" \
              "corpus_${k}/"
            rc=$?
            set -e
            [ $rc -eq 0 ] || { echo "❌ fuzz_strip_${k} crash (exit $rc)"; exit 1; }
            echo "::endgroup::"
            echo "✓ fuzz_strip_${k}: no crashes in 20s"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fuzz-fast-crashes
          path: ${{ github.workspace }}/ci/fuzz/crash-*
          retention-days: 14
