# sync-sha: 3dc36e580647f2d711c42731916a03953b575c14d025162a84c25ca0a6ac39ad
name: Build and Test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NGINX_VERSION: "1.31.1"

on:
  # Triggered by ci.yml, which lanes the PR suite so peak runner use stays
  # bounded. No push/pull_request trigger here on purpose: two entry points
  # would run this twice per PR and defeat the laning.
  workflow_call: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: Validation
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck shellcheck

      - name: Validate scripts and source
        run: |
          bash -n ci/tools/ci-build.sh
          shellcheck ci/tools/ci-build.sh ci/tools/sync-stamp.sh
          # Each stamped .github/ file carries a `# sync-sha:` of its own
          # content, so a `--list` diff against nginx-skeleton-module names
          # exactly which copies have drifted. The stamps are only worth
          # reading if they cannot go stale, hence this gate: edit a workflow
          # without running ci/tools/sync-stamp.sh and the PR goes red here.
          bash ci/tools/sync-stamp.sh --check
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=normalCheckLevelMaxBranches \
            --suppress=unusedFunction \
            src/strip_core.c \
            src/ngx_http_strip_filter_module.c
          git diff --check

      - name: Lint workflows
        run: |
          version=1.7.7
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          tarball="actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/actionlint.tgz "${base}/${tarball}"
          curl -fsSL -o /tmp/actionlint.checksums \
            "${base}/actionlint_${version}_checksums.txt"
          ( cd /tmp && grep " ${tarball}\$" actionlint.checksums \
              | sed 's#'"${tarball}"'#actionlint.tgz#' | sha256sum -c - )
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/*.yml

  build:
    name: Build (${{ matrix.flavor }} ${{ matrix.version }} / ${{ matrix.cc }})
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: nginx
            version: "1.31.1"
            cc: gcc
            primary: true
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang curl libpcre2-dev zlib1g-dev

      - name: Cache source tarball
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/${{ matrix.flavor }}-${{ matrix.version }}.tar.gz
          key: src-${{ matrix.flavor }}-${{ matrix.version }}

      - name: Build server and dynamic module
        env:
          CC: ${{ matrix.cc }}
        run: |
          bash ci/tools/ci-build.sh "${{ matrix.flavor }}" "${{ matrix.version }}"
          build=".build/${{ matrix.flavor }}-${{ matrix.version }}/objs"
          test -f "$build/ngx_http_strip_filter_module.so"

      - name: Strict module compile
        run: |
          build=".build/${{ matrix.flavor }}-${{ matrix.version }}"
          cflags=$(awk '/^CFLAGS[[:space:]]*=/{sub(/^CFLAGS[[:space:]]*=[[:space:]]*/,""); print; exit}' "$build/objs/Makefile")
          incs=$(awk '/^ALL_INCS[[:space:]]*=/{found=1} found{line=$0; sub(/^ALL_INCS[[:space:]]*=[[:space:]]*/,"",line); continued=(line ~ /\\$/); gsub(/\\$/, "", line); printf "%s ", line; if (!continued) exit}' "$build/objs/Makefile")
          # shellcheck disable=SC2086
          (
            cd "$build"
            "${{ matrix.cc }}" -c -fPIC $cflags \
              -Wall -Wextra -Wshadow -Wstrict-prototypes \
              -Wstrict-aliasing -Wunreachable-code -Werror \
              -Wno-unused-parameter \
              -I "$GITHUB_WORKSPACE/src" \
              $incs "$GITHUB_WORKSPACE/src/ngx_http_strip_filter_module.c" \
              -o /tmp/module_wrapper.o
            "${{ matrix.cc }}" -c $cflags \
              -Wall -Wextra -Wshadow -Wstrict-prototypes \
              -Wstrict-aliasing -Wunreachable-code -Werror \
              -Wno-unused-parameter \
              "$GITHUB_WORKSPACE/src/strip_core.c" \
              -o /tmp/module_core.o
          )

      - name: Stage artifact
        if: matrix.primary
        run: |
          mkdir artifact
          cp ".build/nginx-${NGINX_VERSION}/objs/nginx" artifact/
          cp ".build/nginx-${NGINX_VERSION}/objs/ngx_http_strip_filter_module.so" artifact/

      - name: Upload nginx artifact
        if: matrix.primary
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: nginx-mainline
          path: artifact/
          retention-days: 1

  unit-core:
    name: Core unit tests
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang gcovr

      # strip_core.c has no nginx dependency, so its unit suite needs no server
      # build and runs in seconds. Both compilers, because the core is also
      # compiled by whichever CC the consuming build uses.
      - name: Run unit suite (gcc and clang)
        run: |
          for cc in gcc clang; do
            echo "== $cc"
            "$cc" -O1 -g -std=c11 -Wall -Wextra -Werror -Isrc \
              -o "/tmp/strip_core_test.$cc" ci/tests/unit/test_scan.c src/strip_core.c
            "/tmp/strip_core_test.$cc"
          done

      # Sanitizers on the core only: the whole point of the ngx-independent
      # split is that it can be driven without a worker.
      - name: Run unit suite under ASan and UBSan
        run: |
          clang -O1 -g -std=c11 -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Isrc \
            -o /tmp/strip_core_test.san ci/tests/unit/test_scan.c src/strip_core.c
          ASAN_OPTIONS=detect_leaks=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            /tmp/strip_core_test.san

      # Reported, never gated. Chasing the percentage produces tests that
      # execute lines without asserting anything; the gate that matters is the
      # per-case control mutation, applied in review. See the harness docs:
      # https://github.com/myguard-labs/nginx-test-harness/blob/main/docs/COVERAGE.md
      - name: Report core coverage (informational)
        run: |
          work=$(mktemp -d)
          gcc -O0 -g --coverage -std=c11 -Isrc \
            -o "$work/t" ci/tests/unit/test_scan.c src/strip_core.c
          "$work/t" >/dev/null
          gcov -o "$work" "$work/t-strip_core.gcda" | grep -A1 strip_core.c
          echo "--- lines with no coverage (each needs a test or a COVERAGE: note) ---"
          awk -F: '/#####/ { printf "src/strip_core.c:%s:%s\n", $2, substr($0, index($0, $3)) }' \
            strip_core.c.gcov || true

  test-nginx:
    name: Test::Nginx
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 20
    needs: build
    env:
      # This job's OWN 64-wide port band. build-test.yml, asan.yml and
      # valgrind.yml pin the same self-hosted runner and have disjoint
      # concurrency groups, so nothing serialises them: two runtime suites can
      # start at the same instant, and a shared default port makes the later
      # one's listener collide with the earlier one's server.
      TEST_BASE_PORT: '19200'
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download nginx artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: nginx-mainline
          path: nginx-bin

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpanminus libio-socket-ssl-perl
          sudo cpanm --notest --quiet Test::Nginx

      # Runs BEFORE the first step that binds the band -- `prove` below. Fails
      # if the band reaches the kernel ephemeral range or is already occupied
      # by a leftover server, either of which would otherwise surface inside
      # the suite as a bind error or a timeout with no cause attached.
      - name: Verify this job's port band is free
        run: bash ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Run Test::Nginx suite
        env:
          TEST_NGINX_SERVROOT: ${{ github.workspace }}/ci/t/servroot
          TEST_NGINX_BINARY: ${{ github.workspace }}/nginx-bin/nginx
          TEST_NGINX_LOAD_MODULES: ${{ github.workspace }}/nginx-bin/ngx_http_strip_filter_module.so
          TEST_NGINX_PORT: ${{ env.TEST_BASE_PORT }}
        run: |
          chmod +x nginx-bin/nginx
          prove -v ci/t/
