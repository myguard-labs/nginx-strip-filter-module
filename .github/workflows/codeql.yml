# sync-sha: df76e68291db05bbe90bde01104d8dfedd4f87b4ea15c22996c06332d477fe4d
name: CodeQL

# CodeQL on the module TU only.
#
# The critical detail is the `module` build mode. For COMPILED languages CodeQL
# populates its database from whatever the traced build actually compiles -- the
# `paths` / `paths-ignore` filters are silently IGNORED. Tracing a full nginx
# build therefore pulls all of upstream nginx into the database and floods the
# Security tab with alerts against code we neither own nor patch. Scope is
# instead enforced by the build: ci-build.sh's `module` mode runs
# `make modules` only, so the nginx core is never compiled and never traced.
#
# Runs on ubuntu-latest, not the self-hosted runners: it needs no nginx binary,
# and the hosted image already ships the CodeQL bundle.
#
# Action pins:
# actions/checkout@v5      -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/cache@v4         -> 0057852bfaa89a56745cba8c7296529d2fc39830
# github/codeql-action@v4  -> 8aad20d150bbac5944a9f9d289da16a4b0d87c1e

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # Triggered by ci.yml, which lanes the PR suite so peak runner use stays
  # bounded. No push/pull_request trigger here on purpose: two entry points
  # would run this twice per PR and defeat the laning.
  workflow_call: {}
  schedule:
    # Monthly, day 4 @ 04:47 UTC. Staggered away from ci-deep.yml (day 6) so
    # the two heavy scheduled runs never contend for the same runners.
    - cron: "47 4 4 * *"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # required to upload the SARIF results
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libpcre2-dev zlib1g-dev

      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: c-cpp
          queries: security-extended
          # Deliberately no paths/paths-ignore: they do nothing for C/C++ (see
          # the header comment). The `module` build below is what scopes this.

      - name: Cache source tarball
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/nginx-${{ env.NGINX_VERSION }}.tar.gz
          key: src-nginx-${{ env.NGINX_VERSION }}

      # NO_CACHE=1: CodeQL's tracer only sees a compile that actually invokes
      # the compiler. ccache serves a hit without running cc, so a warm cache
      # silently produces a database CodeQL can't populate -- "no source seen
      # during build" -- while the build itself looks fine. Tracing needs a
      # real compile every run; ccache and the CodeQL job are incompatible.
      - name: Build traced source (module only)
        run: NO_CACHE=1 bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" module

      - name: Analyze
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: /language:c-cpp

      - name: Assert non-zero translation-unit count
        run: |
          set -eu

          # Locate the traced DB. The init action's own db-location output is
          # the authority; fall back to searching RUNNER_TEMP only if that
          # output is unexpectedly empty (defensive, still verified below).
          DB_DIR="${{ steps.init.outputs.db-location }}"
          if [ -z "$DB_DIR" ]; then
            echo "WARNING: init action db-location output was empty; searching RUNNER_TEMP" >&2
            DB_DIR=$(find "${RUNNER_TEMP}/codeql_databases" -maxdepth 1 -type d -name 'cpp*' | head -n1 || true)
          fi

          if [ -z "$DB_DIR" ] || [ ! -d "$DB_DIR" ]; then
            echo "ERROR: could not locate CodeQL database directory (DB_DIR='$DB_DIR')"
            exit 1
          fi
          echo "CodeQL database dir: $DB_DIR"

          # The `codeql database info`/`resolve` subcommand surface is not
          # stable across CLI versions on this runner (verified in CI: the
          # bundled 2.26.2 CLI rejects `database info` outright). What the
          # C/C++ extractor genuinely, unambiguously emits is one .trap /
          # .trap.gz file per traced translation unit in the database's trap
          # dir -- that's what "traced translation units" concretely means
          # for a compiled-language database, so count those directly instead
          # of depending on CLI subcommand output shape.
          TRAP_DIR="$DB_DIR/trap/cpp"
          echo "Trap dir: $TRAP_DIR"
          if [ ! -d "$TRAP_DIR" ]; then
            echo "ERROR: trap dir does not exist ('$TRAP_DIR'). Treating as zero translation units."
            exit 1
          fi

          echo "trap dir listing (top level):"
          find "$TRAP_DIR" -maxdepth 1 -mindepth 1 | head -20

          TU_COUNT=$(find "$TRAP_DIR" -type f \( -name '*.trap' -o -name '*.trap.gz' \) | wc -l)

          echo "CodeQL traced translation units: $TU_COUNT"

          case "$TU_COUNT" in
            ''|*[!0-9]*)
              echo "ERROR: translation-unit count is empty or non-numeric ('$TU_COUNT'). Treating as failure."
              exit 1
              ;;
          esac

          if [ "$TU_COUNT" -eq 0 ]; then
            echo "ERROR: CodeQL traced zero translation units. Build filter may be too narrow."
            exit 1
          fi
