# sync-sha: 49ac01e98263316a81a26a68024151e979973d3a056dbf7f1e6474ee8491671b
name: A/UBSan

# Dedicated ASan+UBSan run on every PR/push -- the Test::Nginx ci/t/ suite run
# once under a static ASan+UBSan nginx build. This is the same check that used
# to be the `asan` job inside build-test.yml; it moves to its own workflow so
# it can be laned/cancelled independently and so build-test.yml stays about
# the plain debug build, not sanitizers.
#
# The asan build is a STATIC --add-module binary (ci-build.sh's `asan` mode
# switches from --add-dynamic-module to --add-module), so the sanitizer
# runtime is present on every code path -- there is no separate .so to load.
#
# Why this exists alongside the Valgrind job: ASan is fast enough to run the
# full ci/t/ suite on every PR and catches heap overflow / UAF outside
# nginx's pool blocks; Valgrind (much slower) still catches uninitialised
# reads and intra-pool UAF that ASan cannot see. They are complementary, not
# redundant -- see valgrind.yml.
#
# Action pins (keep in sync with build-test.yml / valgrind.yml headers):
# actions/checkout@v5 -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/cache@v4    -> 0057852bfaa89a56745cba8c7296529d2fc39830

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NGINX_VERSION: "1.31.1"
  CCACHE_DIR: ${{ github.workspace }}/.ccache

on:
  # Triggered by ci.yml, which lanes the PR suite so peak runner use stays
  # bounded. No push/pull_request trigger here on purpose: two entry points
  # would run this twice per PR and defeat the laning.
  workflow_call: {}

concurrency:
  group: asan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  asan:
    name: ASan and UBSan (ci/t/ suite)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 30
    env:
      # This job's OWN 64-wide port band. build-test.yml, asan.yml and
      # valgrind.yml pin the same self-hosted runner and have disjoint
      # concurrency groups, so nothing serialises them: two runtime suites can
      # start at the same instant, and a shared default port makes the later
      # one's listener collide with the earlier one's server.
      TEST_BASE_PORT: '19264'
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libpcre2-dev zlib1g-dev cpanminus \
            libio-socket-ssl-perl ccache
          sudo cpanm --notest --quiet Test::Nginx

      # Hybrid: self-hosted disk persists naturally; actions/cache backs the
      # fork path. No restore-keys prefix (never partial-match a build tree).
      - name: Cache ccache (asan)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-asan-${{ hashFiles('src/**', 'ci/tools/ci-build.sh') }}

      - name: Build with sanitizers
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" asan

      - name: ccache stats
        if: always()
        run: ccache -s

      # Runs BEFORE the first step that binds the band -- `prove` below. Fails
      # if the band reaches the kernel ephemeral range or is already occupied
      # by a leftover server, either of which would otherwise surface inside
      # the suite as a bind error or a timeout with no cause attached.
      - name: Verify this job's port band is free
        run: bash ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Run Test::Nginx suite under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TEST_NGINX_SERVROOT: ${{ github.workspace }}/ci/t/servroot
          TEST_NGINX_BINARY: ${{ github.workspace }}/.build/nginx-${{ env.NGINX_VERSION }}/objs/nginx
          TEST_NGINX_PORT: ${{ env.TEST_BASE_PORT }}
        run: prove -v ci/t/
