# sync-sha: 6bfb4745d2c0c2cbe25ce452c255ff2e7d65416c394243f53d153019eaac916e
name: CI

# Single entry point for the PR suite.
#
# The checks below each carried their own push/pull_request trigger, so a
# PR asked for all of them at once. This orchestrator calls them instead, which
# is what makes lane arrangement possible at all: a caller can order its members
# with `needs:`, independent workflows cannot be ordered by anything.
#
# All members (asan.yml, fuzzing.yml, security-scanners.yml, codeql.yml,
# build-test.yml) are workflow_call:-only; they run exactly once per PR, via
# this orchestrator, with no independent pull_request: trigger.
#
# VALGRIND IS NOT A MEMBER, as of 2026-08-05. valgrind.yml was Lane A and the
# budget-setter at 769s measured; it dominated the whole PR suite (13-15 min
# typical, 24 min worst) for a job whose findings are weekly-cadence
# information, not per-commit information. It now runs on its own weekly cron
# plus workflow_dispatch, UNCHANGED in depth -- same suite, suppressions,
# error-exitcode and leak kinds. This is a deliberate divergence from the
# nginx-skeleton-module reference, which lanes valgrind per-PR; do not restore
# it here as accidental drift. Rationale and per-PR memory-safety coverage that
# remains (asan.yml) are in valgrind.yml's header and CI_PERFORMANCE.md.
#
# LANED. Self-hosted slot ceiling is 4 (builder02-runner-01..04, org-registered).
# Budget = longest lane = Lane B at ~313s (measured run 31008062208,
# 2026-08-05). Reproduce with:
#   gh api repos/myguard-labs/nginx-strip-filter-module/actions/runs/31008062208/jobs \
#     --jq '.jobs[] | "\(.name)\t\(.started_at)\t\(.completed_at)"'
# See also CI_PERFORMANCE.md. Lane map:
#
#   Lane B -- build-test (unchained, fans out to 3 concurrent self-hosted jobs:
#     Validation 24s, Build 30s, unit-core 16s; then Test::Nginx 45s needs:
#     build) -> fuzzing (needs: build-test, 149s) -> asan (needs: fuzzing, 65s).
#     Lane total ~= 313s. This is now the budget-setter.
#   Lane C -- security-scanners (needs: build-test, 76s + Linter 35s).
#     Lane total ~= 111s.
#   Off-lane -- codeql: runs on ubuntu-latest (GitHub-hosted). Not laned, no
#     needs: -- hosted jobs are not laned.
#
# Lane A is retired with valgrind's removal; Lane B and C keep their letters so
# this map stays diffable against the pre-2026-08-05 shape.
#
# Peak self-hosted demand = Lane B's build-test fan-out (3), one below the
# ceiling. Fullest-lane headroom = 313 - 111 = 202s. The `changes` job below
# adds a brief 4th self-hosted slot; see its comment.
#
# asan.yml IS a PR-lane member, called unconditionally (no path-filter gate).
# The reference gates it behind a changed-files filter because its 149s
# sanitizer job is otherwise wasted on docs-only PRs, but that gate is a lane-
# budget optimization, not a correctness requirement, and this repo has no
# equivalent changed-files job yet. Unconditional is also strictly no
# regression: this same Test::Nginx-under-ASan check previously ran
# unconditionally as build-test.yml's own `asan` job on every PR; moving it to
# its own workflow must not make it run less often. Add a path filter here in
# a follow-up once this repo's lanes are actually being measured/built.
#
# No push: trigger, by repo policy: CI runs on the PR, and the merge commit is
# identical to the tested PR head, so re-running it on merge buys nothing.

on:
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  # "orchestrator-", not "ci-": build-test.yml already uses
  # ci-${{ github.workflow }}-${{ github.ref }}, and a called workflow inherits
  # the caller's github.workflow/github.ref -- so an identical group string
  # makes a member cancel its own caller, and the call dies before it starts a
  # single job. The prefix is what keeps the two apart.
  group: orchestrator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Lane map sanity
    runs-on: ["self-hosted", "builder02", "lxc"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: "Assert documented lane map matches needs: graph"
        run: python3 ci/tools/check-lane-map.py .github/workflows/ci.yml

  build-test:
    name: Build&Test
    permissions:
      contents: read
    uses: ./.github/workflows/build-test.yml

  fuzzing:
    name: Fuzzing
    needs: build-test
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/fuzzing.yml

  asan:
    name: A/UBSan
    needs: fuzzing
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/asan.yml

  security-scanners:
    name: Security scanners
    needs: build-test
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/security-scanners.yml

  codeql:
    name: CodeQL
    permissions:
      contents: read
      # Granted per-job, not at workflow level: no other job here needs either.
      security-events: write  # CodeQL uploads its SARIF to code scanning
      actions: read  # the CodeQL action reads run metadata to attribute results
    uses: ./.github/workflows/codeql.yml
