# sync-sha: 934ecf459922a7b91d4033c6b8d237b5322a905f013294d08636dd1e0ce8ce31
name: CI Deep

# Exhaustive dynamic analysis. Monthly cron + on-demand ONLY -- never on a PR.
#
# The PR-time gates are the standalone workflows: fuzzing.yml (120s fuzz
# regression), valgrind.yml (60s memcheck lite) and security-scanners.yml. This
# file is their long-running counterpart: hours of fuzz discovery, 600s memcheck
# and helgrind soaks. Splitting them is what keeps the merge path fast while
# still running the heavy analysis somewhere.
#
# Jobs: build-flavors (nginx mainline/stable + angie) · fuzz (long) · memcheck
#   soak · helgrind soak.
#   memcheck AND helgrind run via ci/tools/soak.sh (USE_VALGRIND / USE_HELGRIND),
#   which passes --suppressions=ci/tools/valgrind.supp and --error-exitcode=99.
#
# build-flavors exists because build-test.yml (the fast PR gate) only builds
# ONE pinned nginx version -- the module claims angie support and tracks both
# nginx release branches, but nothing in CI actually built angie or nginx
# stable until this job. It is here (monthly), not in the PR gate, because
# each leg is a from-scratch configure+compile+Test::Nginx run and three of
# them would blow the PR gate's <15min budget.
#
# No chat notifications by design: a failure here surfaces as a red run + the
# uploaded crash/corpus artifacts + the job summary. Add a notify step only if
# someone is actually going to act on it -- an unread alert is worse than none.
#
# Action pins (keep in sync with build-test.yml):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/upload-artifact@v5 -> 330a01c490aca151604b8cf639adc76d48f6c5d4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Monthly, day 6 @ 03:30 UTC -- staggered from codeql.yml (day 4).
    - cron: "30 3 6 * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Fuzz duration (seconds)"
        required: false
        default: "3600"

concurrency:
  group: ci-deep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-flavors:
    # matrix.label, not the version: the job name is evaluated before any step
    # runs, so the resolved version is not available here.
    name: Build & Test::Nginx (${{ matrix.flavor }} ${{ matrix.label }})
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # A matrix is expanded before any step runs, so load-versions.sh cannot
      # feed it. Each cell therefore names the versions.env KEY it wants, and
      # the build step dereferences it after the pins are loaded -- keeping the
      # versions themselves in one file instead of re-hardcoding them here.
      matrix:
        include:
          - flavor: nginx
            version_key: NGINX_MAINLINE
            label: mainline
          - flavor: nginx
            version_key: NGINX_STABLE
            label: stable
          - flavor: angie
            version_key: ANGIE_VERSION
            label: angie
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libpcre2-dev zlib1g-dev \
            cpanminus libio-socket-ssl-perl
          sudo cpanm --notest --quiet Test::Nginx

      - name: Resolve matrix version
        # The cell names a versions.env key (NGINX_MAINLINE/NGINX_STABLE/
        # ANGIE_VERSION); dereference it now that load-versions.sh has put the
        # pins in the environment, so later steps can use env.MATRIX_VERSION.
        env:
          # Through env, not inline ${{ }}: an expression expanded straight into
          # a run: block is template injection (zizmor template-injection). The
          # matrix values are repo-controlled today, but the safe shape costs
          # nothing and stops the pattern from being copied somewhere it is not.
          MATRIX_VERSION_KEY: ${{ matrix.version_key }}
        run: |
          key="$MATRIX_VERSION_KEY"
          value="${!key:-}"
          if [ -z "$value" ]; then
            echo "::error::$key is not set in .github/versions.env"
            exit 1
          fi
          echo "MATRIX_VERSION=$value" >> "$GITHUB_ENV"
          echo "resolved $key=$value"

      - name: Cache source tarball
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/${{ matrix.flavor }}-${{ env.MATRIX_VERSION }}.tar.gz
          key: src-${{ matrix.flavor }}-${{ env.MATRIX_VERSION }}

      - name: Build server and dynamic module
        # angie names its binary objs/angie, nginx names it objs/nginx. Assert
        # BOTH artifacts and export the server path, so the flavor's real binary
        # name lives in one place instead of being hardcoded per step -- checking
        # only the .so passes for angie while leaving the server unverified.
        env:
          MATRIX_FLAVOR: ${{ matrix.flavor }}   # via env, see the note above
        run: |
          set -euo pipefail
          bash ci/tools/ci-build.sh "$MATRIX_FLAVOR" "$MATRIX_VERSION"
          build=".build/$MATRIX_FLAVOR-${MATRIX_VERSION}-debug/objs"
          case "$MATRIX_FLAVOR" in
              angie) server="$build/angie" ;;
              *)     server="$build/nginx" ;;
          esac
          test -f "$build/ngx_http_strip_filter_module.so"
          test -x "$server"
          echo "SERVER_BIN=$GITHUB_WORKSPACE/$server" >> "$GITHUB_ENV"
          echo "MODULE_SO=$GITHUB_WORKSPACE/$build/ngx_http_strip_filter_module.so" >> "$GITHUB_ENV"

      - name: Run ci/t/
        env:
          # Set by the build step above -- it resolves the flavor's binary name
          # (angie vs nginx) once, after the version is known.
          TEST_NGINX_BINARY: ${{ env.SERVER_BIN }}
          TEST_NGINX_LOAD_MODULES: ${{ env.MODULE_SO }}
          # See build-test.yml's identical setting for why this must be 20, not
          # the ~2s Test::Nginx::Socket default.
          TEST_NGINX_TIMEOUT: "20"
          TEST_NGINX_SERVROOT: ${{ github.workspace }}/ci/t/servroot
        # Test::Nginx probes a server on PATH for its version and Bailouts if it
        # finds none -- TEST_NGINX_BINARY alone does not satisfy that probe, so
        # the objs/ dir goes on PATH too.
        run: PATH="$(dirname "$TEST_NGINX_BINARY"):$PATH" prove -v ci/t/

  fuzz:
    name: Fuzz (all 6 kinds, long)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 600
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install clang + libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Select fuzz duration
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "FUZZ_SECS=${{ github.event.inputs.fuzz_seconds }}" >> "$GITHUB_ENV"
          else
            echo "FUZZ_SECS=3600" >> "$GITHUB_ENV"
          fi

      - name: Build fuzz targets
        run: bash ci/fuzz/build.sh "$GITHUB_WORKSPACE/ci/fuzz"

      - name: Fuzz each target
        run: |
          set -euo pipefail
          cd ci/fuzz
          for k in html css js json svg xml; do
            echo "::group::fuzz_strip_${k}"
            set +e
            ./"fuzz_strip_${k}" \
              -max_total_time="$FUZZ_SECS" \
              -dict="fuzz.dict.${k}" \
              -print_final_stats=1 \
              -artifact_prefix="crash-${k}-" \
              "corpus_${k}/"
            rc=$?
            set -e
            [ $rc -eq 0 ] || { echo "❌ fuzz_strip_${k} crash (exit $rc)"; exit 1; }
            mkdir -p "corpus_${k}-min"
            ./"fuzz_strip_${k}" -merge=1 "corpus_${k}-min/" "corpus_${k}/"
            echo "merged ${k}: $(find "corpus_${k}-min" -type f | wc -l) units"
            echo "::endgroup::"
            echo "✓ fuzz_strip_${k}: no crashes in ${FUZZ_SECS}s"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fuzz-deep-crashes
          path: ${{ github.workspace }}/ci/fuzz/crash-*
          retention-days: 30

      - name: Upload minimized corpus
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fuzz-corpus
          path: ${{ github.workspace }}/ci/fuzz/corpus_*-min
          retention-days: 30

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 ${{ github.repository }} — CI Deep / fuzz FAILED. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true

  memcheck:
    name: Valgrind Memcheck soak
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 240
    env:
      # This job's OWN 64-wide port band. ci-deep.yml's memcheck and helgrind
      # jobs run in the same workflow with no serialisation between them, and
      # the whole runner pool is shared with build-test.yml / asan.yml /
      # valgrind.yml too, so a shared default port makes the later job's
      # listener collide with the earlier job's server.
      TEST_BASE_PORT: '19328'
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libpcre2-dev valgrind zlib1g-dev \
            cpanminus libio-socket-ssl-perl
          sudo cpanm --notest --quiet Test::Nginx

      - name: Cache source tarball
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/nginx-${{ env.NGINX_VERSION }}.tar.gz
          key: src-nginx-${{ env.NGINX_VERSION }}

      - name: Build debug server and module
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" debug

      # Runs BEFORE the first step that binds the band -- `prove` below. Fails
      # if the band reaches the kernel ephemeral range or is already occupied
      # by a leftover server, either of which would otherwise surface inside
      # the suite as a bind error or a timeout with no cause attached.
      - name: Verify this job's port band is free
        run: bash ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Run Test::Nginx suite under Memcheck (WITH suppressions)
        env:
          # TEST_NGINX_BINARY must be the bare nginx path: Test::Nginx runs
          # can_run($TEST_NGINX_BINARY) and bails ("Cannot find the nginx
          # executable in the PATH") if it is a multi-word command. The valgrind
          # wrapper goes through the native TEST_NGINX_USE_VALGRIND hook instead
          # (string form: Test::Nginx prepends `valgrind -q <opts>`).
          TEST_NGINX_SERVROOT: ${{ github.workspace }}/ci/t/servroot
          TEST_NGINX_BINARY: ${{ github.workspace }}/.build/nginx-${{ env.NGINX_VERSION }}/objs/nginx
          TEST_NGINX_USE_VALGRIND: >-
            --tool=memcheck --track-origins=yes --leak-check=full
            --show-leak-kinds=definite,indirect
            --errors-for-leak-kinds=definite,indirect --error-exitcode=99
            --suppressions=${{ github.workspace }}/ci/tools/valgrind.supp
            --log-file=${{ github.workspace }}/valgrind-%p.log
          TEST_NGINX_LOAD_MODULES: >-
            ${{ github.workspace }}/.build/nginx-${{ env.NGINX_VERSION }}/objs/ngx_http_strip_filter_module.so
          TEST_NGINX_SLEEP: 2
          TEST_NGINX_PORT: ${{ env.TEST_BASE_PORT }}
        run: prove -v ci/t/

      - name: Verify Memcheck reports
        if: always()
        run: |
          cat valgrind-*.log || true
          if grep -Eq 'ERROR SUMMARY: [1-9][0-9]* errors' valgrind-*.log 2>/dev/null; then
            exit 1
          fi

      - name: Upload Memcheck reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: memcheck-reports
          path: valgrind-*.log
          retention-days: 14

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 ${{ github.repository }} — CI Deep / memcheck FAILED. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true

  helgrind:
    name: Valgrind Helgrind soak
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 240
    env:
      # This job's OWN 64-wide port band. ci-deep.yml's memcheck and helgrind
      # jobs run in the same workflow with no serialisation between them, and
      # the whole runner pool is shared with build-test.yml / asan.yml /
      # valgrind.yml too, so a shared default port makes the later job's
      # listener collide with the earlier job's server.
      TEST_BASE_PORT: '19392'
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libpcre2-dev valgrind zlib1g-dev \
            cpanminus libio-socket-ssl-perl
          sudo cpanm --notest --quiet Test::Nginx

      - name: Cache source tarball
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/nginx-${{ env.NGINX_VERSION }}.tar.gz
          key: src-nginx-${{ env.NGINX_VERSION }}

      - name: Build debug server and module
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" debug

      # Runs BEFORE the first step that binds the band -- `prove` below. Fails
      # if the band reaches the kernel ephemeral range or is already occupied
      # by a leftover server, either of which would otherwise surface inside
      # the suite as a bind error or a timeout with no cause attached.
      - name: Verify this job's port band is free
        run: bash ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Run Test::Nginx suite under Helgrind (--error-exitcode=99, WITH suppressions)
        env:
          # TEST_NGINX_BINARY must be the bare nginx path: Test::Nginx runs
          # can_run($TEST_NGINX_BINARY) and bails ("Cannot find the nginx
          # executable in the PATH") if it is a multi-word command. The valgrind
          # wrapper goes through the native TEST_NGINX_USE_VALGRIND hook instead
          # (string form: Test::Nginx prepends `valgrind -q <opts>`).
          TEST_NGINX_SERVROOT: ${{ github.workspace }}/ci/t/servroot
          TEST_NGINX_BINARY: ${{ github.workspace }}/.build/nginx-${{ env.NGINX_VERSION }}/objs/nginx
          TEST_NGINX_USE_VALGRIND: >-
            --tool=helgrind --error-exitcode=99
            --suppressions=${{ github.workspace }}/ci/tools/valgrind.supp
            --log-file=${{ github.workspace }}/helgrind-%p.log
          TEST_NGINX_LOAD_MODULES: >-
            ${{ github.workspace }}/.build/nginx-${{ env.NGINX_VERSION }}/objs/ngx_http_strip_filter_module.so
          TEST_NGINX_SLEEP: 2
          TEST_NGINX_PORT: ${{ env.TEST_BASE_PORT }}
        run: prove -v ci/t/

      - name: Verify Helgrind reports
        if: always()
        run: |
          cat helgrind-*.log || true
          if grep -Eq 'ERROR SUMMARY: [1-9][0-9]* errors' helgrind-*.log 2>/dev/null; then
            exit 1
          fi

      - name: Upload Helgrind reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: helgrind-reports
          path: helgrind-*.log
          retention-days: 14

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 ${{ github.repository }} — CI Deep / helgrind FAILED. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true

  scanners:
    name: Security scanners
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flawfinder clang-tidy python3 python3-pip pipx nginx-dev
          # semgrep: isolate via pipx (PEP 668 blocks a bare pip3 install into the
          # system Python on the Ubuntu 24.04 self-hosted runner). Fall back to a
          # user pip install with --break-system-packages if pipx is unavailable.
          if command -v pipx >/dev/null; then
            pipx install --quiet semgrep
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            pip3 install --quiet --user --break-system-packages semgrep
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Configure nginx src tree (clang-tidy headers)
        run: |
          set -euo pipefail
          wget -q "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz"
          tar -xzf "nginx-${NGINX_VERSION}.tar.gz"; cd "nginx-${NGINX_VERSION}"
          CC=gcc ./configure --with-compat --add-dynamic-module="$GITHUB_WORKSPACE" >/dev/null
          echo "NGINX_SRC_TREE=$PWD" >> "$GITHUB_ENV"
      - name: flawfinder
        run: |
          flawfinder --minlevel=1 \
            "$GITHUB_WORKSPACE/src/ngx_http_strip_filter_module.c" \
            "$GITHUB_WORKSPACE/src/strip_core.c" 2>&1 | tee flawfinder.log
          if flawfinder --minlevel=4 --quiet \
               "$GITHUB_WORKSPACE/src/ngx_http_strip_filter_module.c" \
               "$GITHUB_WORKSPACE/src/strip_core.c" 2>/dev/null | grep -Eq 'Hits = [1-9]'; then
            echo "✗ flawfinder: high-severity (>=4) findings" >&2
            exit 1
          fi
      - name: clang-tidy (cert-*, security.*)
        run: |
          set -euo pipefail
          N="$NGINX_SRC_TREE"
          INCLUDES="-I$N/src/core -I$N/src/event -I$N/src/event/modules -I$N/src/event/quic \
            -I$N/src/os/unix -I$N/objs -I$N/src/http -I$N/src/http/modules -I$N/src/http/v2 \
            -I$GITHUB_WORKSPACE -I/usr/include"
          status=0
          for f in \
            "$GITHUB_WORKSPACE/src/strip_core.c" \
            "$GITHUB_WORKSPACE/src/ngx_http_strip_filter_module.c"; do
            # shellcheck disable=SC2086
            clang-tidy "$f" \
              --checks='-*,cert-*,clang-analyzer-security.*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling' \
              --warnings-as-errors='*' -- $INCLUDES 2>&1 | tee -a clang-tidy.log || status=1
          done
          exit "$status"
      - name: semgrep
        run: |
          semgrep scan --config p/c --config p/security-audit \
            "$GITHUB_WORKSPACE/src/strip_core.c" \
            "$GITHUB_WORKSPACE/src/ngx_http_strip_filter_module.c" 2>&1 | tee semgrep.log || true
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: security-reports
          path: |
            ${{ github.workspace }}/flawfinder.log
            ${{ github.workspace }}/clang-tidy.log
            ${{ github.workspace }}/semgrep.log
          retention-days: 14
